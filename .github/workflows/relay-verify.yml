name: Relay verify

# Checks that the script Cloudflare is running is one the Relay deploy workflow built, and that
# the Worker has no setting that lets anything else observe its requests.

on:
  schedule:
    - cron: "17 * * * *"
  # Relay deploy calls this after each deploy.
  workflow_call:
  workflow_dispatch:

permissions: {}

# A newer check replaces one in progress.
concurrency:
  group: relay-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Compare the deployed Worker with what this repository built
    runs-on: ubuntu-26.04
    # Stops a stalled step from holding the runner for GitHub's 6-hour default.
    timeout-minutes: 10
    # The Cloudflare account and a token that can read the Worker's script belong to this
    # environment, which only runs from main.
    environment: relay-verify
    permissions:
      contents: read # check out the repository
      attestations: read # look up the bundle's attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Node that mise.toml pins. No cache here, so nothing an earlier run saved
      # can change what this check runs.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: false

      - name: Download the deployed script
        run: node relay/scripts/deployed-script.ts "$RUNNER_TEMP/deployed.js"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Fails unless the deploy workflow in this repository attested a file with this hash.
      - name: Check it against the attested bundles
        run: >
          gh attestation verify "$RUNNER_TEMP/deployed.js"
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/relay-deploy.yml"
        env:
          GH_TOKEN: ${{ github.token }}

      # Fails when the Worker has a Tail Worker, log push, observability, or a binding the
      # relay doesn't use. Those are outside the script, so the hash does not cover them.
      - name: Check the Worker's settings
        run: node relay/scripts/check-settings.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
