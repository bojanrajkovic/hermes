name: Relay verify

# Checks that the script Cloudflare is running is one the Relay deploy workflow built.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: [Relay deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  verify:
    # Skipped until the repository names the Cloudflare account the relay runs in.
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Download the deployed script
        run: node relay/scripts/deployed-script.mjs "$RUNNER_TEMP/deployed.js"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Fails unless the deploy workflow in this repository attested a file with this hash.
      - name: Check it against the attested bundles
        run: >
          gh attestation verify "$RUNNER_TEMP/deployed.js"
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/relay-deploy.yml"
        env:
          GH_TOKEN: ${{ github.token }}
