# Runs the Swift, relay, and workflow checks for the paths a change touches. The `Check` job
# reports one result for all of them, so main's ruleset can require a single status check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A newer push to the same pull request replaces the run in progress. Runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Find changed paths
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # check out the repository
      pull-requests: read # list a pull request's files
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      relay: ${{ steps.filter.outputs.relay }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      # For a pull request, paths-filter lists the changed files through the API. For a push, it
      # compares commits with git, so it needs a checkout.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            swift:
              - "Package.swift"
              - "Package.resolved"
              - "Sources/**"
              - "Tests/**"
              - ".xcode-version"
              - "Makefile"
              - ".github/workflows/ci.yml"
            relay:
              - "relay/**"
              - "mise.toml"
              - ".github/workflows/ci.yml"
            workflows:
              - ".github/workflows/**"

  swift:
    name: Compile and test
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    # The image with Xcode 27. The Makefile picks the version .xcode-version names from the ones
    # the image carries, and `make deps` fails if it isn't there.
    runs-on: xcode-27
    # Stops a stalled step from holding the runner for GitHub's 6-hour default.
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails, and prints the difference, when Package.resolved or a copied grammar scanner doesn't
      # match Package.swift. Renovate's post-upgrade script writes both without running Swift, so
      # this is where Swift checks its work.
      - name: Check Package.resolved and the copied scanners
        run: |
          make packages
          git diff --exit-code -- Package.resolved Sources/TreeSitterScanners
      - run: make check
      - run: make test

  relay:
    name: Lint, test, and bundle
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-26.04
    # Stops a stalled step from holding the runner for GitHub's 6-hour default.
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Node and pnpm that mise.toml pins. Only a push to main saves the cache. A pull
      # request restores main's cache and saves none.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      # Fails if a package's registry signature doesn't verify.
      - run: pnpm audit signatures
      - run: pnpm check
      - run: pnpm build

  # Audits the workflows for security problems, such as an action that isn't pinned to a commit.
  zizmor:
    name: zizmor
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    # One step of a few seconds, so the 1-vCPU runner is enough.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A finding fails the job and shows as an annotation on the pull request.
      - uses: zizmorcore/zizmor-action@a818f16177a5395fc11d3c73577caabaa7119391 # v0.9.1
        with:
          persona: auditor
          advanced-security: false
          annotations: true

  # Main's ruleset requires only this check. It counts a skipped job as passed, because a check
  # job is skipped when the change didn't touch its paths. If `changes` fails, GitHub skips
  # every check job, so `Check` also reads the result of `changes`.
  check:
    name: Check
    needs: [changes, swift, relay, zizmor]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
