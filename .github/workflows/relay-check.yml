name: Relay check

on:
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay-check.yml"
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
